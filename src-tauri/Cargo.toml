[package]
name = "code-lite"
version = "0.1.4"
description = "Code Lite desktop shell"
authors = ["Code Lite"]
edition = "2021"

[lib]
name = "code_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
