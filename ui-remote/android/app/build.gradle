apply plugin: 'com.android.application'

def codeLiteVersionFile = new File(rootProject.projectDir, '../../VERSION')
if (!codeLiteVersionFile.isFile()) {
    throw new GradleException("VERSION file not found: ${codeLiteVersionFile}")
}

def codeLiteVersion = System.getenv('CODE_LITE_VERSION') ?: codeLiteVersionFile.getText('UTF-8').trim()
def codeLiteBuildTime = java.time.ZonedDateTime.now(java.time.ZoneId.of('Asia/Shanghai'))
def codeLiteBuildId = System.getenv('CODE_LITE_BUILD_ID')
        ?: codeLiteBuildTime.format(java.time.format.DateTimeFormatter.ofPattern("'build-'yyyy-MM-dd-HH-mm"))
def codeLiteDisplayVersion = System.getenv('CODE_LITE_DISPLAY_VERSION') ?: "${codeLiteVersion} ${codeLiteBuildId}"
def codeLiteVersionCodeValue = System.getenv('CODE_LITE_ANDROID_VERSION_CODE')
if (!codeLiteVersionCodeValue) {
    def versionCodeEpoch = java.time.LocalDateTime.of(2020, 1, 1, 0, 0)
    codeLiteVersionCodeValue = java.time.temporal.ChronoUnit.MINUTES.between(
            versionCodeEpoch,
            codeLiteBuildTime.toLocalDateTime()
    ) + 1
}
def codeLiteVersionCode = Integer.parseInt(codeLiteVersionCodeValue.toString())
def codeLiteRepoRoot = new File(rootProject.projectDir, '../..').canonicalFile
def codeLiteSigningPropertiesFile = new File(codeLiteRepoRoot, 'env/android-signing.properties')
def codeLiteSigningProperties = new java.util.Properties()
def codeLiteReleaseSigningAvailable = codeLiteSigningPropertiesFile.isFile()
def codeLiteReleaseKeystoreFile = null

if (codeLiteReleaseSigningAvailable) {
    codeLiteSigningPropertiesFile.withInputStream { stream ->
        codeLiteSigningProperties.load(stream)
    }
    def requiredSigningKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
    def missingSigningKeys = requiredSigningKeys.findAll { key ->
        !codeLiteSigningProperties.getProperty(key)?.trim()
    }
    if (!missingSigningKeys.isEmpty()) {
        throw new GradleException("Missing Android signing properties: ${missingSigningKeys.join(', ')}")
    }

    codeLiteReleaseKeystoreFile = new File(codeLiteSigningProperties.getProperty('storeFile'))
    if (!codeLiteReleaseKeystoreFile.isAbsolute()) {
        codeLiteReleaseKeystoreFile = new File(codeLiteRepoRoot, codeLiteReleaseKeystoreFile.path)
    }
    if (!codeLiteReleaseKeystoreFile.isFile()) {
        throw new GradleException("Android release keystore not found: ${codeLiteReleaseKeystoreFile}")
    }
}

android {
    namespace = "com.codelite.remote"
    compileSdk = rootProject.ext.compileSdkVersion
    buildToolsVersion = "36.1.0"
    signingConfigs {
        release {
            if (codeLiteReleaseSigningAvailable) {
                storeFile codeLiteReleaseKeystoreFile
                storePassword codeLiteSigningProperties.getProperty('storePassword')
                keyAlias codeLiteSigningProperties.getProperty('keyAlias')
                keyPassword codeLiteSigningProperties.getProperty('keyPassword')
            }
        }
    }
    defaultConfig {
        applicationId "com.codelite.remote"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode codeLiteVersionCode
        versionName codeLiteVersion
        resValue "string", "code_lite_display_version", codeLiteDisplayVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            if (codeLiteReleaseSigningAvailable) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def releasePackageRequested = taskGraph.allTasks.any { task ->
        task.path.startsWith(':app:')
                && task.name.endsWith('Release')
                && ['assemble', 'bundle', 'package'].any { prefix -> task.name.startsWith(prefix) }
    }
    if (releasePackageRequested && !codeLiteReleaseSigningAvailable) {
        throw new GradleException(
                "Android release signing is not configured. Run scripts/setup-android-signing.ps1 first."
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
