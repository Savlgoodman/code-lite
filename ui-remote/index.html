<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5f3" />
    <title>Code Lite Remote</title>

    <!-- PWA：应用清单与图标 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- iOS Safari 独立启动支持 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Code Lite" />
    <script>
      // 首屏前应用已保存的主题，避免闪白
      (function () {
        try {
          var t = localStorage.getItem("code-lite-theme");
          var m = localStorage.getItem("code-lite-mode");
          if (t !== "warm" && t !== "mono") t = "mono";
          if (m !== "dark" && m !== "light") {
            m = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          var r = document.documentElement;
          r.setAttribute("data-theme", t);
          r.setAttribute("data-mode", m);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
