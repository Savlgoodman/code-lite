[project]
name = "code-lite-agent-sdk-research"
version = "0.1.0"
description = "Safe reflection probes for code-lite Agent SDK adapter research"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "nanobot-ai>=0.2.2",
    "openai-codex>=0.1.0b2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["sdk_capability_probe.py"]
