[project]
name = "code-lite-nanobot-demo"
version = "0.1.0"
description = "Code Lite nanobot SDK CLI approval demo"
requires-python = ">=3.11"
dependencies = [
    "nanobot-ai>=0.2.2",
    "openai-codex>=0.1.0b2",
]

[project.entry-points."nanobot.tools"]
demo_weather = "code_lite_nanobot_demo.weather_tool:WeatherTool"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code_lite_nanobot_demo"]
