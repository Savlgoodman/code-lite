[project]
name = "code-lite-backend"
version = "0.1.4"
description = "Code Lite Python backend powered by nanobot"
requires-python = ">=3.11"
dependencies = [
    "agent-client-protocol>=0.10.1",
    "fastapi>=0.115.0",
    "nanobot-ai>=0.2.2",
    "uvicorn>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code_lite_backend"]

